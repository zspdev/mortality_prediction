[project]
name = "hcw-ml"
version = "0.1.0"
description = "ML modelling of COVID-19 mortality from hospital load data across countries"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "jupyterlab>=4.0",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcw_ml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
